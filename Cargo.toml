[package]
name = "herdr-pi-reloader"
version = "0.1.3"
edition = "2024"
description = "Reload or restart idle Pi agent sessions from a Herdr popup"
license = "MIT"
repository = "https://github.com/jigenator/herdr-pi-reloader"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
shell-escape = "0.1.5"
tokio = {version = "1", features = ["process", "time", "rt-multi-thread", "macros"]}
