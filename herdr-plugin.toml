id = "herdr-pi-reloader.pi-reloader"
name = "Herdr Pi Reloader"
version = "0.1.4"
min_herdr_version = "0.9.0"
description = "Reload or restart idle Pi agent sessions from a Herdr popup"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open"
title = "Open Pi Reloader"
contexts = ["workspace"]
command = ["sh", "-lc", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"${HERDR_PLUGIN_ID:-herdr-pi-reloader.pi-reloader}\" --entrypoint tui --focus"]

[[panes]]
id = "tui"
title = "Pi Reloader"
placement = "popup"
command = ["./target/release/herdr-pi-reloader", "tui"]
